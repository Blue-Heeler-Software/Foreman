name: Linux CI

on:
  push:
    branches: [main, codey/ubuntu-gui-alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-build-test:
    name: Ubuntu build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate shell scripts
        run: |
          bash -n scripts/install-ubuntu.sh
          bash -n scripts/uninstall-ubuntu.sh
          bash -n scripts/package-ubuntu.sh
          bash -n packaging/ubuntu/install-bundle.sh.in
          bash -n packaging/ubuntu/uninstall-bundle.sh

      - name: Restore Linux projects
        run: |
          dotnet restore src/Foreman.Agent/Foreman.Agent.csproj
          dotnet restore src/Foreman.App.Linux/Foreman.App.Linux.csproj
          dotnet restore tests/Foreman.Agent.Tests/Foreman.Agent.Tests.csproj
          dotnet restore tests/Foreman.Platform.Linux.Tests/Foreman.Platform.Linux.Tests.csproj

      - name: Build Linux agent and desktop
        run: |
          dotnet build src/Foreman.Agent/Foreman.Agent.csproj -c Release --no-restore
          dotnet build src/Foreman.App.Linux/Foreman.App.Linux.csproj -c Release --no-restore

      - name: Run Linux tests
        run: |
          dotnet test tests/Foreman.Agent.Tests/Foreman.Agent.Tests.csproj -c Release --no-restore
          dotnet test tests/Foreman.Platform.Linux.Tests/Foreman.Platform.Linux.Tests.csproj -c Release --no-restore

      - name: Publish self-contained executables
        run: |
          dotnet publish src/Foreman.Agent/Foreman.Agent.csproj -c Release -r linux-x64 --self-contained true --no-restore
          dotnet publish src/Foreman.App.Linux/Foreman.App.Linux.csproj -c Release -r linux-x64 --self-contained true --no-restore
